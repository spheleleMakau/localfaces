databases:
  - name: local-faces-db
    databaseName: localfaces
    user: localfaces
    region: frankfurt
    plan: basic-256mb

services:
  - type: web
    name: local-faces-summer-camp
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn localfaces.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    disk:
      name: private-applicant-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: local-faces-db
          property: connectionString
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/private_uploads
      - key: LOCAL_FACES_WHATSAPP_NUMBER
        value: 27671012841
      - key: MAX_APPLICATION_PHOTO_BYTES
        value: "8388608"
